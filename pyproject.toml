[project]
name = "resume-helper"
version = "0.1.0"
description = "Tailor an existing resume and recruiter email to a job description"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.4",
    "pyyaml>=6.0.2",
    "pydantic>=2.8.0",
    "python-docx>=1.1.2",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "pypdf>=5.0.0",
]

[project.scripts]
build-master = "app.importer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
