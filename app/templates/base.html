<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Resume Tailor{% endblock %}</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --card: #ffffff;
      --ink: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #1d4ed8;
      --accent-2: #eff6ff;
      --green: #047857;
      --amber: #b45309;
      --red: #b91c1c;
      --shadow: 0 1px 2px rgba(17, 24, 39, .05), 0 8px 24px rgba(17, 24, 39, .04);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    a { color: var(--accent); }
    h1, h2, h3 { margin: 0; line-height: 1.25; letter-spacing: -0.01em; }
    h1 { font-size: 24px; }
    h2 { font-size: 16px; }
    h3 { font-size: 14px; }
    p { margin: 0 0 10px; }
    .container { width: min(1280px, 100% - 40px); margin: 0 auto; }
    .topbar {
      position: sticky; top: 0; z-index: 20;
      background: rgba(255, 255, 255, .9);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }
    .topbar-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; color: var(--ink); text-decoration: none; }
    .brand-mark { width: 28px; height: 28px; border-radius: 7px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 15px; font-weight: 700; }
    .main { padding: 26px 0 60px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(280px, .75fr); gap: 20px; align-items: start; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; box-shadow: var(--shadow); }
    .card + .card { margin-top: 16px; }
    .muted { color: var(--muted); }
    .small { font-size: 12.5px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .stack { display: grid; gap: 14px; }
    label { display: block; font-weight: 600; font-size: 12.5px; margin: 0 0 6px; }
    .req { color: var(--red); }
    input[type="text"], input[type="email"], input:not([type]), textarea, select {
      width: 100%; border: 1px solid #d1d5db; border-radius: 8px; background: #fff;
      color: var(--ink); padding: 9px 11px; font: inherit; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(29, 78, 216, .12); }
    textarea { resize: vertical; min-height: 200px; }
    textarea.short { min-height: 74px; }
    .checks { display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; padding-bottom: 2px; }
    .check { display: flex; align-items: center; gap: 8px; font-weight: 500; margin: 0; }
    .check input { width: 15px; height: 15px; accent-color: var(--accent); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      background: var(--accent); color: #fff; border: 1px solid var(--accent);
      border-radius: 8px; padding: 10px 16px; font: inherit; font-weight: 650;
      cursor: pointer; text-decoration: none; transition: filter .15s, transform .05s;
    }
    .btn:hover { filter: brightness(1.06); }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: .6; cursor: progress; }
    .btn.secondary { background: #fff; color: var(--ink); border-color: #d1d5db; }
    .btn.small { padding: 7px 11px; font-size: 12.5px; }
    .hidden { display: none !important; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      display: inline-flex; align-items: center; border: 1px solid var(--line);
      background: #f9fafb; color: #374151; border-radius: 999px; padding: 3px 9px;
      font-size: 12px; line-height: 1.4;
    }
    .chip.matched { background: #ecfdf5; border-color: #a7f3d0; color: var(--green); }
    .chip.missing { background: #fffbeb; border-color: #fde68a; color: var(--amber); }
    .notice { border-radius: 9px; padding: 10px 12px; font-size: 13px; margin: 12px 0; }
    .notice.info { background: var(--accent-2); border: 1px solid #bfdbfe; color: #1e40af; }
    .notice.warn { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; }
    .notice.error { background: #fef2f2; border: 1px solid #fecaca; color: var(--red); }
    .progress { display: flex; align-items: center; gap: 10px; margin-top: 14px; color: var(--muted); font-size: 13px; }
    .spinner {
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid #d1d5db; border-top-color: var(--accent);
      animation: spin .8s linear infinite; flex: 0 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13px; }
    .kv .k { color: var(--muted); }
    .plain { padding-left: 18px; margin: 8px 0 0; }
    .plain li { margin: 4px 0; }
    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
    .stat { background: #f9fafb; border: 1px solid var(--line); border-radius: 9px; padding: 10px; }
    .stat b { display: block; font-size: 18px; }
    .stat span { font-size: 11.5px; color: var(--muted); }

    /* Review */
    .review-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 14px; }
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 0 0 16px; flex-wrap: wrap; }
    .tab { background: transparent; border: 0; border-bottom: 2px solid transparent; padding: 9px 12px; font: inherit; font-weight: 600; color: var(--muted); cursor: pointer; }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-panel { animation: fade .12s ease; }
    @keyframes fade { from { opacity: .4; } to { opacity: 1; } }
    .preview-wrap { background: #dfe3e8; border: 1px solid var(--line); border-radius: 12px; padding: 22px; overflow: auto; }
    .edit-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 16px; align-items: start; }
    .item-card { border: 1px solid var(--line); border-radius: 9px; padding: 12px; background: #fff; }
    .item-card + .item-card { margin-top: 10px; }
    .item-head { display: flex; align-items: flex-start; gap: 9px; }
    .item-head .title { font-weight: 650; flex: 1; }
    .item-card textarea { min-height: 44px; margin-top: 7px; font-size: 13px; padding: 7px 9px; }
    .item-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
    .item-off { opacity: .5; }
    .result-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

    /* Resume sheet */
    .resume-sheet { width: max-content; margin: 0 auto; }
    .resume {
      width: 8.5in; min-height: 11in; padding: .5in .7in; background: #fff;
      font-family: "Times New Roman", "Liberation Serif", serif;
      font-size: 10.5pt; line-height: 1.2; color: #111;
      box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 12px 40px rgba(0,0,0,.12);
    }
    .resume a { color: #1155CC; }
    .r-name { text-align: center; font-size: 24pt; font-weight: 700; margin: 0 0 2pt; letter-spacing: 0; }
    .r-headline { text-align: center; font-family: Arial, "Liberation Sans", sans-serif; font-size: 12pt; font-weight: 700; margin: 0 0 2pt; }
    .r-contact { text-align: center; font-size: 10pt; margin: 0 0 8pt; }
    .r-section { font-size: 12pt; font-weight: 700; border-bottom: .8pt solid #A0A0A0; margin: 6pt 0 3pt; padding-bottom: .6pt; }
    .r-line { display: flex; justify-content: space-between; gap: 14px; margin: 0 0 1.2pt; }
    .r-line .l { flex: 1; }
    .r-line .r { white-space: nowrap; text-align: right; }
    .r-bullets { list-style: none; margin: 0; padding: 0; }
    .r-bullets li { position: relative; padding-left: .22in; margin: 0 0 1.2pt; }
    .r-bullets li::before { content: "●"; position: absolute; left: 0; }
    .r-skill { position: relative; padding-left: .22in; margin: 0 0 1.2pt; font-size: 10pt; }
    .r-skill::before { content: "●"; position: absolute; left: 0; }
    .r-summary { margin: 0 0 2pt; }
    .r-small { font-size: 10pt; }
    .r-italic { font-style: italic; }

    @media (max-width: 980px) {
      .layout, .edit-grid { grid-template-columns: 1fr; }
      .container { width: min(1280px, 100% - 24px); }
    }
    @media (max-width: 620px) {
      .row { grid-template-columns: 1fr; }
      .resume { font-size: 10pt; }
    }
  </style>
</head>
<body>
{% block content %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
